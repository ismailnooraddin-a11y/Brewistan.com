<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Your cafe loyalty cards in one place.">
  <meta name="theme-color" content="#151311">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Brewistan">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">
  <title>Brewistan</title>
  <style>
    html, body { margin: 0; height: 100%; background: #151311; }
    #splash {
      position: fixed; inset: 0; z-index: 900; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 18px; background: #151311;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; color: #c8a96a;
      transition: opacity 200ms ease;
    }
    #splash .mark {
      width: 72px; height: 72px; border-radius: 50%; border: 1.5px solid rgba(200,169,106,.6);
      display: grid; place-items: center; font: 600 34px Georgia, 'Times New Roman', serif;
    }
    #splash .bar { width: 120px; height: 2px; border-radius: 2px; background: rgba(200,169,106,.18); overflow: hidden; }
    #splash .bar::after { content: ''; display: block; width: 40%; height: 100%; background: #c8a96a; animation: slide 1.1s ease-in-out infinite; }
    @keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(260%); } }
    @media (prefers-reduced-motion: reduce) { #splash .bar::after { animation: none; width: 100%; } }

    #install {
      position: fixed; z-index: 1000; left: 12px; right: 12px;
      bottom: calc(12px + env(safe-area-inset-bottom, 0px));
      max-width: 460px; margin: 0 auto; padding: 14px 14px 14px 16px; border-radius: 14px;
      background: #f7f3ec; color: #151311; box-shadow: 0 10px 30px rgba(0,0,0,.35);
      font: 14px/1.45 -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Kufi Arabic', sans-serif;
      display: flex; gap: 12px; align-items: center;
    }
    #install[hidden] { display: none; }
    #install img { width: 40px; height: 40px; border-radius: 10px; flex: none; }
    #install .text { flex: 1; min-width: 0; }
    #install strong { display: block; font-weight: 600; }
    #install button { font: inherit; border: 0; cursor: pointer; }
    #install .go { background: #151311; color: #f7f3ec; border-radius: 9px; padding: 8px 14px; font-weight: 600; }
    #install .close { background: transparent; color: #6f665c; font-size: 20px; line-height: 1; padding: 4px 6px; }
  </style>
</head>
<body>
  <div id="splash" role="status" aria-label="Loading Brewistan"><div class="mark">B</div><div class="bar"></div></div>

  <div id="install" role="dialog" aria-live="polite" hidden>
    <img src="icons/Icon-192.png" alt="">
    <div class="text"><strong id="install-title"></strong><span id="install-body"></span></div>
    <button class="go" id="install-go" hidden></button>
    <button class="close" id="install-close" aria-label="Close">×</button>
  </div>

  <script>
    // Remove the loading screen once Flutter has drawn its first frame.
    window.addEventListener('flutter-first-frame', function () {
      var s = document.getElementById('splash');
      if (!s) return;
      s.style.opacity = '0';
      setTimeout(function () { s.remove(); }, 220);
    });

    // "Add to Home Screen" guide. iPhone has no install button, so we explain it;
    // Android Chrome offers a real install prompt, which we show as a button.
    (function () {
      var DISMISS_KEY = 'bw_install_dismissed_at';
      var standalone = window.navigator.standalone === true || window.matchMedia('(display-mode: standalone)').matches;
      if (standalone) return;
      try {
        var last = Number(localStorage.getItem(DISMISS_KEY) || 0);
        if (Date.now() - last < 14 * 86400000) return;
      } catch (e) {}

      var lang = (navigator.language || 'en').toLowerCase();
      var L = lang.indexOf('ckb') === 0 || lang.indexOf('ku') === 0 ? 'ckb' : lang.indexOf('ar') === 0 ? 'ar' : 'en';
      var T = {
        en: { title: 'Install Brewistan', ios: 'Tap Share, then “Add to Home Screen” for one-tap access and offers from your cafes.', android: 'Add it to your phone for one-tap access and offers from your cafes.', go: 'Install' },
        ar: { title: 'ثبّت Brewistan', ios: 'اضغط زر المشاركة ثم «إضافة إلى الشاشة الرئيسية» للوصول بلمسة واحدة واستلام عروض مقاهيك.', android: 'أضفه إلى هاتفك للوصول بلمسة واحدة واستلام عروض مقاهيك.', go: 'تثبيت' },
        ckb: { title: 'Brewistan دابمەزرێنە', ios: 'دوگمەی هاوبەشکردن دابگرە، پاشان «زیادکردن بۆ شاشەی سەرەکی» بۆ گەیشتن بە یەک دەستلێدان و وەرگرتنی ئۆفەرەکان.', android: 'زیادی بکە بۆ مۆبایلەکەت بۆ گەیشتن بە یەک دەستلێدان و وەرگرتنی ئۆفەرەکان.', go: 'دامەزراندن' }
      }[L];
      var box = document.getElementById('install');
      if (L !== 'en') box.setAttribute('dir', 'rtl');
      document.getElementById('install-title').textContent = T.title;
      function show(body) {
        document.getElementById('install-body').textContent = body;
        setTimeout(function () { box.hidden = false; }, 2500);
      }
      document.getElementById('install-close').addEventListener('click', function () {
        box.hidden = true;
        try { localStorage.setItem(DISMISS_KEY, String(Date.now())); } catch (e) {}
      });

      var ua = navigator.userAgent;
      var isIOS = /iphone|ipad|ipod/i.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
      if (isIOS) { show(T.ios); return; }

      window.addEventListener('beforeinstallprompt', function (e) {
        e.preventDefault();
        var go = document.getElementById('install-go');
        go.textContent = T.go;
        go.hidden = false;
        go.onclick = function () { box.hidden = true; e.prompt(); };
        show(T.android);
      });
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
