name: brewistan
description: Brewistan loyalty app for customers and baristas.
publish_to: 'none'
version: 1.0.1+2

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  supabase_flutter: ^2.8.0
  flutter_secure_storage: ^9.2.2
  cryptography: ^2.7.0
  qr_flutter: ^4.1.0
  mobile_scanner: ^6.0.2
  local_auth: ^2.3.0
  sqflite: ^2.4.1
  path: ^1.9.0
  connectivity_plus: ^6.1.0
  firebase_core: ^3.8.0
  firebase_messaging: ^15.1.5
  uuid: ^4.5.1
  provider: ^6.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
