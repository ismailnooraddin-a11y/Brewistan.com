name: Mobile release build

# Manual: Actions > Mobile release build > Run workflow.
# Produces a signed Android App Bundle (for Google Play) and an unsigned iOS build check.
on:
  workflow_dispatch:
    inputs:
      build_name:
        description: Version name (e.g. 1.0.0)
        required: true
        default: 1.0.1
      build_number:
        description: Build number (increase every upload)
        required: true
        default: '2'

permissions:
  contents: read
  actions: read

jobs:
  verify-ci:
    runs-on: ubuntu-latest
    outputs:
      run_id: ${{ steps.ci.outputs.run_id }}
    steps:
      - uses: actions/github-script@v7
        id: ci
        with:
          script: |
            const {data}=await github.rest.actions.listWorkflowRuns({
              owner:context.repo.owner,repo:context.repo.repo,workflow_id:'ci.yml',
              branch:'main',event:'push',status:'completed',per_page:100
            });
            const run=data.workflow_runs.find(r=>r.head_sha===context.sha&&r.conclusion==='success');
            if(!run)throw new Error('Release requires successful main-push CI for this exact commit.');
            core.setOutput('run_id',String(run.id));
  android:
    needs: verify-ci
    environment: production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@v4
        with:
          name: tested-mobile-baseline
          path: mobile-baseline
          run-id: ${{ needs.verify-ci.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Load tested Flutter version and lockfile
        id: baseline
        run: |
          VERSION="$(python3 -c "import json; print(json.load(open('mobile-baseline/flutter-version.json'))['frameworkVersion'])")"
          echo "flutter_version=$VERSION" >> "$GITHUB_OUTPUT"
          cp mobile-baseline/pubspec.lock apps/mobile/pubspec.lock
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.baseline.outputs.flutter_version }}
          channel: stable
          cache: true
      - run: bash scripts/setup-mobile.sh
      - name: Reject dependency drift and repeat mobile checks
        working-directory: apps/mobile
        run: |
          cmp pubspec.lock ../../mobile-baseline/pubspec.lock
          flutter analyze --no-fatal-infos
          flutter test
      - name: Require signing and public configuration
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
          PLATFORM_PUBLIC_KEY: ${{ vars.PLATFORM_PUBLIC_KEY }}
        run: |
          for key in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD SUPABASE_URL SUPABASE_ANON_KEY PLATFORM_PUBLIC_KEY; do
            [ -n "${!key}" ] || { echo "::error::Missing $key"; exit 1; }
          done
      - name: Build app bundle
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          BUILD_NAME: ${{ inputs.build_name }}
          BUILD_NUMBER: ${{ inputs.build_number }}
        working-directory: apps/mobile
        run: |
          [[ "$BUILD_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] && [[ "$BUILD_NUMBER" =~ ^[0-9]+$ ]] || exit 1
          umask 077
          export ANDROID_KEYSTORE_PATH="$(mktemp)"
          trap 'rm -f "$ANDROID_KEYSTORE_PATH"' EXIT
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
          python3 ../../scripts/configure-android-signing.py .
          flutter build appbundle --release \
            --build-name="$BUILD_NAME" --build-number="$BUILD_NUMBER" \
            --dart-define=SUPABASE_URL="${{ vars.SUPABASE_URL }}" \
            --dart-define=SUPABASE_ANON_KEY="${{ vars.SUPABASE_ANON_KEY }}" \
            --dart-define=PLATFORM_PUBLIC_KEY="${{ vars.PLATFORM_PUBLIC_KEY }}" \
            --dart-define=FIREBASE_API_KEY="${{ vars.FIREBASE_API_KEY }}" \
            --dart-define=FIREBASE_PROJECT_ID="${{ vars.FIREBASE_PROJECT_ID }}" \
            --dart-define=FIREBASE_SENDER_ID="${{ vars.FIREBASE_SENDER_ID }}" \
            --dart-define=FIREBASE_ANDROID_APP_ID="${{ vars.FIREBASE_ANDROID_APP_ID }}" \
            --dart-define=APP_VERSION="$BUILD_NAME"
          jarsigner -verify build/app/outputs/bundle/release/app-release.aab
      - uses: actions/upload-artifact@v4
        with:
          name: brewistan-android-${{ inputs.build_name }}-${{ inputs.build_number }}
          path: apps/mobile/build/app/outputs/bundle/release/app-release.aab

  ios:
    needs: verify-ci
    environment: production
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: tested-mobile-baseline
          path: mobile-baseline
          run-id: ${{ needs.verify-ci.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Load tested Flutter version and lockfile
        id: baseline
        run: |
          VERSION="$(python3 -c "import json; print(json.load(open('mobile-baseline/flutter-version.json'))['frameworkVersion'])")"
          echo "flutter_version=$VERSION" >> "$GITHUB_OUTPUT"
          cp mobile-baseline/pubspec.lock apps/mobile/pubspec.lock
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.baseline.outputs.flutter_version }}
          channel: stable
          cache: true
      - run: bash scripts/setup-mobile.sh
      - name: Reject dependency drift and repeat mobile checks
        working-directory: apps/mobile
        run: |
          cmp pubspec.lock ../../mobile-baseline/pubspec.lock
          flutter analyze --no-fatal-infos
          flutter test
      - name: Build (no code signing)
        env:
          BUILD_NAME: ${{ inputs.build_name }}
          BUILD_NUMBER: ${{ inputs.build_number }}
        working-directory: apps/mobile
        run: |
          [[ "$BUILD_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] && [[ "$BUILD_NUMBER" =~ ^[0-9]+$ ]] || exit 1
          flutter build ios --release --no-codesign \
            --build-name="$BUILD_NAME" --build-number="$BUILD_NUMBER" \
            --dart-define=SUPABASE_URL="${{ vars.SUPABASE_URL }}" \
            --dart-define=SUPABASE_ANON_KEY="${{ vars.SUPABASE_ANON_KEY }}" \
            --dart-define=PLATFORM_PUBLIC_KEY="${{ vars.PLATFORM_PUBLIC_KEY }}" \
            --dart-define=FIREBASE_API_KEY="${{ vars.FIREBASE_API_KEY }}" \
            --dart-define=FIREBASE_PROJECT_ID="${{ vars.FIREBASE_PROJECT_ID }}" \
            --dart-define=FIREBASE_SENDER_ID="${{ vars.FIREBASE_SENDER_ID }}" \
            --dart-define=FIREBASE_IOS_APP_ID="${{ vars.FIREBASE_IOS_APP_ID }}" \
            --dart-define=APP_VERSION="$BUILD_NAME"
